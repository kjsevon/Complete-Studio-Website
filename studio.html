  <!-- BOOKING FORM -->
  <section id="booking">
    <div class="section-inner">
      <span class="section-label">Book the Space</span>
      <h2>Make something here.</h2>
      <form class="booking-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="date">Preferred Date</label>
            <input type="date" id="date" name="date" required />
          </div>
          <div class="form-group">
            <label for="time">Preferred Time</label>
            <input type="time" id="time" name="time" required />
          </div>
        </div>
        <div class="form-group">
          <label for="session">Session Type</label>
          <select id="session" name="session" required>
            <option value="" disabled selected>Select a session type</option>
            <option value="photo-shoot">Photo Shoot</option>
            <option value="video-shoot">Video Shoot</option>
            <option value="recording">Recording Session</option>
            <option value="event">Private Event</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" placeholder="Tell us about your project..."></textarea>
        </div>
        <button type="submit" class="btn">Send Request</button>
      </form>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <span>© 2026 Complete Studio. Los Angeles.</span>
  </footer>

  <script src="studio.js?v=nav2"></script>
